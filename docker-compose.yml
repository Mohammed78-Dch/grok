version: "3.9"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    # user: root
    ports:
      - "${N8N_PORT}:${N8N_PORT}"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_PORT=${N8N_PORT}
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped
  
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    # We can also use the N8N_HOST and N8N_PORT variables in the command
    command: http --url=${N8N_HOST} n8n:${N8N_PORT}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - n8n
    restart: unless-stopped



    